<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=__W__, height=__H__">
    <title>Lap Comparison</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-500.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/inter-800.woff2") format("woff2");
        font-weight: 800;
      }
      :root {
        --bg: #0d0d0d;
        --ink: #f0efec;
        --ink2: #c3c2b7;
        --muted: #898781;
        --grid: #2c2c2a;
        --axis: #383835;
        --a: #3987e5;
        --b: #d95926;
        --gold: #ffd21f;
      }
      body {
        margin: 0;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family: "Inter", sans-serif;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }
      video {
        position: absolute;
        object-fit: fill;
        background: #000;
      }
      .head {
        position: absolute;
        top: 26px;
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }
      .tag {
        width: 36px;
        height: 36px;
        border-radius: 6px;
        color: var(--bg);
        font-size: 22px;
        font-weight: 800;
        line-height: 36px;
        text-align: center;
      }
      .title {
        font-size: 22px;
        font-weight: 800;
        white-space: nowrap;
      }
      .sub {
        margin-top: 4px;
        font-size: 16px;
        font-weight: 500;
        color: var(--muted);
        white-space: nowrap;
      }
      .clock {
        position: absolute;
        padding: 8px 18px 8px 16px;
        background: rgba(8, 10, 14, 0.78);
        border-radius: 0 10px 10px 0;
        font-size: 46px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .clock small {
        font-size: 22px;
        font-weight: 500;
        margin-left: 3px;
        color: rgba(255, 255, 255, 0.7);
      }
      #chart {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
      }
      #chart text {
        font-family: "Inter", sans-serif;
        fill: var(--muted);
        font-size: 15px;
        font-weight: 500;
      }
      #chart .ctitle {
        fill: var(--ink2);
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.1em;
      }
      #chart .sec.done {
        fill: var(--ink);
        font-weight: 800;
      }
      #readout {
        position: absolute;
        font-size: 30px;
        font-weight: 800;
        text-align: right;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="__W__" data-height="__H__" data-fps="__FPS__" data-duration="__DURATION__">
      <video id="va" class="clip" src="assets/lap_a.mp4" playsinline __AUDIO_A__ data-start="0" data-duration="__DURATION__" data-track-index="0"></video>
      <video id="vb" class="clip" src="assets/lap_b.mp4" playsinline __AUDIO_B__ data-start="0" data-duration="__DURATION__" data-track-index="1"></video>
      <div id="ui" class="clip" data-start="0" data-duration="__DURATION__" data-track-index="2">
        <div class="head" id="ha"><div class="tag" style="background: var(--a)">A</div><div><div class="title" id="la"></div><div class="sub" id="sa"></div></div></div>
        <div class="head" id="hb"><div class="tag" style="background: var(--b)">B</div><div><div class="title" id="lb"></div><div class="sub" id="sb"></div></div></div>
        <div class="clock" id="ca" style="border-left: 4px solid var(--a)">0.00<small>s</small></div>
        <div class="clock" id="cb" style="border-left: 4px solid var(--b)">0.00<small>s</small></div>
        <svg id="chart" width="__W__" height="__H__"></svg>
        <div id="readout">start</div>
      </div>
    </div>
    <script>
      // Everything below comes from fpvlaps compare: layout, both laps, the running gap (seconds lap A is
      // behind lap B, sampled at D.hz over lap A) and the sector deltas.
      const D = __DATA__;
      const L = D.layout;
      const $ = (id) => document.getElementById(id);
      const place = (el, x, y, w, h) => Object.assign(el.style, { left: x + "px", top: y + "px",
        ...(w ? { width: w + "px", height: h + "px" } : {}) });
      place($("va"), L.xa, L.y, L.pw, L.ph);
      place($("vb"), L.xb, L.y, L.pw, L.ph);
      place($("ha"), L.xa, 26);
      place($("hb"), L.xb, 26);
      $("la").textContent = D.a.label; $("sa").textContent = D.a.sub;
      $("lb").textContent = D.b.label; $("sb").textContent = D.b.sub;
      place($("ca"), L.xa, L.y + L.ph - 84);
      place($("cb"), L.xb, L.y + L.ph - 84);
      const [cx, cy, cw, ch] = D.chart;
      place($("readout"), cx + cw - 420, cy + 2, 400, 40);
      const NS = "http://www.w3.org/2000/svg";
      const svg = $("chart");
      const add = (tag, attrs, text) => {
        const el = document.createElementNS(NS, tag);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        if (text !== undefined) el.textContent = text;
        svg.appendChild(el);
        return el;
      };
      add("text", { x: cx + 16, y: cy + 24, class: "ctitle" }, "GAP  A vs B");
      add("text", { x: cx + 170, y: cy + 24 }, "+ = A behind  /  − = A ahead");
      for (const t of D.ticks) {
        add("line", { x1: D.px0, x2: D.px1, y1: t.y, y2: t.y, stroke: t.v ? "var(--grid)" : "var(--axis)" });
        add("text", { x: cx + 6, y: t.y + 5 }, t.v ? (t.v > 0 ? "+" : "−") + Math.abs(t.v).toFixed(2) : "0");
      }
      add("path", { d: D.area_pos, fill: "var(--b)", "fill-opacity": 0.35 });
      add("path", { d: D.area_neg, fill: "var(--a)", "fill-opacity": 0.35 });
      add("polyline", { points: D.path, fill: "none", stroke: "var(--ink2)", "stroke-width": 2, "stroke-linejoin": "round" });
      add("text", { x: D.px1 - 4, y: D.py0 + 14, "text-anchor": "end" }, "A behind");
      add("text", { x: D.px1 - 4, y: D.py1 - 4, "text-anchor": "end" }, "A ahead");
      const fmt = (g) => (g >= 0 ? "+" : "−") + Math.abs(g).toFixed(2) + "s";
      const secEls = D.sectors.map((s, k) => {
        if (k < D.sectors.length - 1)
          add("line", { x1: s.x1, x2: s.x1, y1: D.py0, y2: D.py1, stroke: "var(--muted)", "stroke-dasharray": "5 5" });
        return add("text", { x: (s.x0 + s.x1) / 2, y: D.py1 + 20, "text-anchor": "middle", class: "sec" }, "S" + (k + 1));
      });
      const cursor = add("line", { x1: D.px0, x2: D.px0, y1: D.py0 - 6, y2: D.py1, stroke: "var(--ink)", "stroke-width": 2 });
      const dot = add("circle", { cx: D.px0, cy: D.zero, r: 6, fill: "var(--ink)", stroke: "var(--bg)", "stroke-width": 2 });

      const gapAt = (t) => {
        const i = Math.min(D.curve.length - 1, Math.max(0, t * D.hz));
        const i0 = Math.floor(i), i1 = Math.min(D.curve.length - 1, i0 + 1);
        return D.curve[i0] + (D.curve[i1] - D.curve[i0]) * (i - i0);
      };
      const words = (g) => Math.abs(g) < 0.005 ? "level" : "A " + Math.abs(g).toFixed(2) + "s " + (g > 0 ? "behind" : "ahead");
      const tA = D.a.time, tB = D.b.time;
      const xOf = (t) => D.px0 + (D.px1 - D.px0) * Math.min(Math.max(t, 0), tA) / tA;
      const yOf = (g) => D.ymid - D.yscale * g;

      // one driver: clip time -> both lap clocks, cursor, gap readout and revealed sector deltas
      const state = { t: 0 };
      const draw = () => {
        const t = state.t - D.lead;
        const a = Math.min(Math.max(t, 0), tA), b = Math.min(Math.max(t, 0), tB);
        $("ca").innerHTML = a.toFixed(2) + "<small>s</small>";
        $("cb").innerHTML = b.toFixed(2) + "<small>s</small>";
        $("ca").style.color = a >= tA ? "var(--gold)" : "var(--ink)";
        $("cb").style.color = b >= tB ? "var(--gold)" : "var(--ink)";
        const g = gapAt(a), x = xOf(a);
        cursor.setAttribute("x1", x); cursor.setAttribute("x2", x);
        dot.setAttribute("cx", x); dot.setAttribute("cy", yOf(g));
        $("readout").textContent = t > 0 ? words(g) : "start";
        D.sectors.forEach((s, k) => {
          const done = a >= s.end - 1e-6;
          secEls[k].textContent = "S" + (k + 1) + (done ? " " + fmt(s.delta) : "");
          secEls[k].classList.toggle("done", done);
        });
      };
      draw();
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(state, { t: 0 }, { t: __DURATION__, duration: __DURATION__, ease: "none", onUpdate: draw }, 0);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
